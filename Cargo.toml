[package]
name = "go19"
version = "0.1.0"
edition = "2024"
default-run = "go19"
autobins = false

[[bin]]
name = "go19"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
crossterm = "0.29"
candle-core = "0.10.2"
candle-nn = "0.10.2"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tensorboard-rs = "0.5"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "frame"] }
bitvec = "1.0.1"

[features]
default = []
gpu-train = []
profile = []

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.10.2", features = ["accelerate", "metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
candle-core = { version = "0.10.2", features = ["cuda"] }

[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
candle-core = { version = "0.10.2", features = ["cuda"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
