[package]
name = "gomoku"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
candle-core = "0.10.2"
candle-nn = "0.10.2"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tensorboard-rs = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.10.2", features = ["accelerate", "metal"] }

[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
candle-core = { version = "0.10.2", features = ["cuda"] }

[profile.release]
lto = "thin"
codegen-units = 1
