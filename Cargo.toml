[package]
name = "gomoku"
version = "0.1.0"
edition = "2024"
default-run = "gomoku"

[[bin]]
name = "pbrain-gomoku"
path = "src/bin/gomoku-engine.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
crossterm = "0.29"
candle-core = "0.10.2"
candle-nn = "0.10.2"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tensorboard-rs = "0.5"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "frame"] }
# Candle 的 NPZ 支持默认不带压缩算法；KataGo 分片使用 deflate。
zip = { version = "7.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
default = []
gpu-train = []
nccl-train = ["gpu-train", "candle-core/nccl"]
profile = []

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.10.2", features = ["accelerate", "metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
candle-core = { version = "0.10.2", features = ["cuda"] }

[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
candle-core = { version = "0.10.2", features = ["cuda", "nccl"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
